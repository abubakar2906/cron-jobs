name: Daily commit

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Append log entry
        run: |
          mkdir -p log
          echo "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> log/activity.log

      - name: Commit and push
        run: |
          git config user.name "abubakar2906"
          git config user.email "158338591+abubakar2906@users.noreply.github.com"
          git add log/activity.log
          git commit -m "chore: daily log entry"
          git push
